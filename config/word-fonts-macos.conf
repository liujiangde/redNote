<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- Keep Latin and Chinese glyphs in the same fallback font when this
       common CJK family is unavailable, preserving PDF text order. -->
  <alias binding="weak">
    <family>Noto Sans CJK SC</family>
    <prefer><family>Heiti SC</family></prefer>
  </alias>
  <alias><family>sans-serif</family><prefer><family>Heiti SC</family></prefer></alias>
</fontconfig>
